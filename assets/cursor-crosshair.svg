<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Precision Crosshair (Default State) -->
  <!-- Dark contrast backing -->
  <g opacity="0.75" stroke="#000000" stroke-width="2.8" stroke-linecap="round">
    <line x1="12" y1="2" x2="12" y2="7.5" />
    <line x1="12" y1="16.5" x2="12" y2="22" />
    <line x1="2" y1="12" x2="7.5" y2="12" />
    <line x1="16.5" y1="12" x2="22" y2="12" />
  </g>
  <circle cx="12" cy="12" r="2.2" fill="#000000" opacity="0.75" />

  <!-- Crisp Pure White Hairline Foreground -->
  <g stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round">
    <line x1="12" y1="2" x2="12" y2="7.5" />
    <line x1="12" y1="16.5" x2="12" y2="22" />
    <line x1="2" y1="12" x2="7.5" y2="12" />
    <line x1="16.5" y1="12" x2="22" y2="12" />
  </g>
  <circle cx="12" cy="12" r="1.3" fill="#FFFFFF" />
</svg>
